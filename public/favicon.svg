<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1A1240"/>
      <stop offset="100%" stop-color="#08060F"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="55%" stop-color="#F6C84B"/>
      <stop offset="100%" stop-color="#DFA32B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6C84B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F6C84B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle outer glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Gold circle -->
  <circle cx="256" cy="256" r="160" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFF0C2" stroke-width="5" opacity="0.6"/>

  <!-- Dashed orbit ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#FFE9A8" stroke-width="4" stroke-dasharray="8 20" opacity="0.4"/>

  <!-- Infinity symbol -->
  <text x="256" y="290" font-family="'Arial','Helvetica',sans-serif" font-weight="700" font-size="180" fill="#1A1240" text-anchor="middle">&#8734;</text>
</svg>
